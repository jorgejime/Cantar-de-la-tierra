<!DOCTYPE html>
<html lang="es" class="scroll-smooth dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Cantar de la Tierra — Santuario Termal</title>
  <meta name="description"
    content="Santuario termal de lujo en las montañas colombianas. Aguas termales, terapias de barro y experiencias naturales en Neira, Caldas." />
  <meta name="theme-color" content="#3F606A" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cantar de la Tierra" />
  <meta property="og:image" content="https://i.ibb.co/m5XN33K2/530225970-1143822651132231-2243828081760603637-n.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Playfair Display + Lato -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            /* ── Primario: verde-azul petróleo ── */
            "primary": "#3F606A",
            "primary-dark": "#2E4A52",
            "primary-light": "#5A8591",

            /* ── Acento: terracota/marrón ── */
            "accent": "#8C6145",
            "accent-dark": "#6B4A34",
            "accent-light": "#A87B5C",

            /* ── Arena dorada ── */
            "sand": "#BA9269",
            "sand-dark": "#9A7652",
            "sand-light": "#D4B08C",

            /* ── Fondos ── */
            "background-light": "#FAF8F5",
            "background-dark": "#181818",
            "surface-light": "#FFFFFF",
            "surface-dark": "#242424",

            /* ── Texto ── */
            "text-main-light": "#2C2C2C",
            "text-main-dark": "#EAEAEA",
          },
          fontFamily: {
            display: ["Playfair Display", "serif"],
            body: ["Lato", "sans-serif"],
            sans: ["Lato", "sans-serif"],
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.9s ease-out both',
            'fade-in': 'fadeIn 0.6s ease-out both',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(24px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
          },
        },
      },
    }
  </script>

  <style>
    /* Fallback de fondo mientras carga React */
    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      background-color: #FAF8F5;
      font-family: 'Lato', sans-serif;
    }

    html.dark body {
      background-color: #181818;
    }

    /* Scrollbar sutil */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #3F606A55;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3F606A;
    }

    /* Date input en modo oscuro */
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.7);
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
